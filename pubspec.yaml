name: animax
description: "Animax — anime streaming app UI kit recreated in Flutter (with pluggable REST backend)."
publish_to: 'none'
version: 2.7.0+29

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  html: ^0.15.5
  shared_preferences: ^2.5.6
  video_player: ^2.9.2
  cronet_http: ^1.10.1
  webview_flutter: ^4.10.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pointycastle: ^4.0.0
  image: ^4.13.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  video_player_media_kit: ^2.0.0
  webview_win_floating: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # IBM Plex Sans Arabic (SIL OFL 1.1, assets/fonts/IBMPlexSansArabic-OFL.txt)
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 800
