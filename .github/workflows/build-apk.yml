name: Build Animax APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "App version: $VER"

      - name: Build full (universal) release APK
        run: >
          flutter build apk --release
          --dart-define=cronetHttpNoPlay=true

      - name: Keep universal APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             animax-${APP_VERSION}-universal.apk

      - name: Build 32-bit (armeabi-v7a) release APK
        run: >
          flutter build apk --release
          --target-platform android-arm
          --split-per-abi
          --dart-define=cronetHttpNoPlay=true

      - name: Rename 32-bit APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             animax-${APP_VERSION}-32bit-armeabi-v7a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animax-apk
          path: animax-*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Animax v${{ env.APP_VERSION }}
          body: |
            Release APKs built by GitHub Actions.

            - `animax-${{ env.APP_VERSION }}-universal.apk`: every phone (32-bit, 64-bit, x86_64) — pick this one
            - `animax-${{ env.APP_VERSION }}-32bit-armeabi-v7a.apk`: smaller build for older 32-bit phones only
            - Commit: ${{ github.sha }}

            Install: download the APK and open it on your Android device (allow installs from unknown sources).
          files: animax-*.apk
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
